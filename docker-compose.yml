services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: civitas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: civitas
      POSTGRES_PASSWORD: civitas_dev
      POSTGRES_DB: civitas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civitas -d civitas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
