name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            webscraping/v2/requirements.txt
            webscraping/v2/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r webscraping/v2/requirements-dev.txt

      # No network, secrets or Playwright browsers needed.
      - name: Run unit tests
        run: python -m pytest webscraping/v2/tests/test_unit.py -v

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front_end
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: front_end/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test
